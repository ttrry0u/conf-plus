stages:
  - lint
  - test

cache:
  paths:
    - .venv/

default:
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y make gcc libpq-dev
    - python -m venv .venv
    - source .venv/bin/activate
    - make install

lint-job:
  stage: lint
  tags:
    - вщсdocker  # <--- тег
  script:
    - source .venv/bin/activate
    - make lint

test-job:
  stage: test
  tags:
    - вщсdocker  # <--- тег
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: confplus_test
    POSTGRES_USER: confplus_user
    POSTGRES_PASSWORD: 123
    # ДОБАВЛЯЕМ ЭТУ СТРОКУ (чтобы main.py при импорте подключался к базе в CI):
    DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus_test"
    # А эта строка у вас уже была:
    TEST_DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus_test"
  script:
    - source .venv/bin/activate
    - make test
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 1 week