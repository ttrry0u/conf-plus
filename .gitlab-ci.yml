stages:
  - lint
  - test
  - security
  - migrate
  - backup
  - build
  - scan-image
  - publish
  - deploy
  - verify-deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

cache:
  paths:
    - .venv/

default:
  image: python:3.11-slim
  tags:
    - вщсdocker
  before_script:
    - apt-get update && apt-get install -y make gcc libpq-dev
    - python -m venv .venv
    - source .venv/bin/activate
    - make install

lint-job:
  stage: lint
  script:
    - source .venv/bin/activate
    - make lint

test-job:
  stage: test
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: confplus_test
    POSTGRES_USER: confplus_user
    POSTGRES_PASSWORD: 123
    DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus_test"
    TEST_DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus_test"
  script:
    - source .venv/bin/activate
    - make test
  cache:
    paths:
      - report.xml
      - htmlcov/

security-job:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . -v

audit-job:
  stage: security
  tags:
    - вщсdocker
  script:
    - source .venv/bin/activate
    - pip install pip-audit
    - pip-audit -r requirements.txt

migrate-job:
  stage: migrate
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: confplus_test
    POSTGRES_USER: confplus_user
    POSTGRES_PASSWORD: 123
    DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus_test"
  script:
    - source .venv/bin/activate
    - make migrate

backup-job:
  stage: backup
  tags:
    - вщсdocker
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: confplus
    POSTGRES_USER: confplus_user
    POSTGRES_PASSWORD: 123
    DATABASE_URL: "postgresql+psycopg://confplus_user:123@postgres:5432/confplus"
  before_script:
    - apt-get update && apt-get install -y postgresql-client make
  script:
    - make backup DB_HOST=postgres DB_NAME=confplus DB_USER=confplus_user
  cache:
    paths:
      - backups/

build-job:
  stage: build
  image: docker:24.0.5-cli
  variables:
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}
    - BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    - docker build --build-arg APP_VERSION=$APP_VERSION --build-arg GIT_COMMIT=$CI_COMMIT_SHA --build-arg BUILD_TIME=$BUILD_TIME -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
    - if [ "$APP_VERSION" != "$CI_COMMIT_SHA" ]; then docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:$APP_VERSION && docker push $CI_REGISTRY_IMAGE:$APP_VERSION; fi

trivy-scan-job:
  stage: scan-image
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script: []
  script:
    - trivy image --exit-code 1 --severity CRITICAL $DOCKER_IMAGE

publish-job:
  stage: publish
  image: docker:24.0.5-cli
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE
    - docker tag $DOCKER_IMAGE $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.deploy_ssh: &deploy_ssh
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

deploy-job:
  stage: deploy
  <<: *deploy_ssh
  resource_group: production
  environment:
    name: preprod
    url: http://$DEPLOY_HOST:8080
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "feature/lab6-cd"
      when: manual
  script:
    - APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}
    - echo "Deploying $APP_VERSION"
    - scp docker-compose.deploy.yml nginx.deploy.conf scripts/deploy.sh scripts/rollback.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/conf-plus-deploy/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "export CI_REGISTRY_USER='$CI_REGISTRY_USER' CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' && cd /opt/conf-plus-deploy && chmod +x scripts/deploy.sh scripts/rollback.sh && ./scripts/deploy.sh $APP_VERSION"

verify-deploy-job:
  stage: verify-deploy
  image: alpine:3.19
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache curl bash
  script:
    - bash scripts/verify-deploy.sh

rollback-job:
  stage: deploy
  <<: *deploy_ssh
  resource_group: production
  environment:
    name: preprod
    url: http://$DEPLOY_HOST:8080
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "feature/lab6-cd"
      when: manual
  script:
    - if [ -n "${ROLLBACK_TO:-}" ]; then ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/conf-plus-deploy && ./scripts/rollback.sh $ROLLBACK_TO"; else ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/conf-plus-deploy && ./scripts/rollback.sh"; fi
