[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]
exclude = ["alembic/versions", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "W", "UP"]
ignore = [
    "S101",   # assert — используется в тестах
    "S104",   # bind 0.0.0.0
    "S105",   # hardcoded password string — дефолты в config.py
    "S106",   # hardcoded password funcarg
    "B008",   # Depends в аргументах — стандарт FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"alembic/*" = ["E", "F", "I", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
